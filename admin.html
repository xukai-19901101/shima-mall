<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拾马商城 · 平台运营后台</title>
  <style>
    :root {
      --brand: #315CF5;
      --brand-dark: #2445BE;
      --ink: #14233B;
      --ink-2: #35445D;
      --muted: #718096;
      --line: #E4E9F1;
      --surface: #FFFFFF;
      --canvas: #F4F6FA;
      --success: #14A889;
      --warning: #E89A28;
      --danger: #E24D5C;
      --nav: #101B32;
      --nav-soft: #192743;
      --shadow: 0 10px 32px rgba(20, 35, 59, .08);
      --radius: 10px;
      --sidebar: 236px;
    }

    * { box-sizing: border-box; }
    html { min-width: 1024px; background: var(--canvas); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(49, 92, 245, .22);
      outline-offset: 2px;
    }
    svg { display: block; }

    .app { min-height: 100vh; }
    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      width: var(--sidebar);
      color: #D7DEED;
      background: var(--nav);
      border-right: 1px solid rgba(255,255,255,.05);
      overflow-y: auto;
    }
    .brand {
      height: 72px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--brand);
      border-radius: 9px 9px 3px 9px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .brand-name { color: #FFF; font-size: 17px; font-weight: 760; letter-spacing: .02em; }
    .brand-sub { margin-top: 2px; color: #8290AA; font-size: 11px; letter-spacing: .1em; }
    .nav { padding: 18px 12px 28px; }
    .nav-group { margin-bottom: 8px; }
    .nav-parent, .nav-item {
      width: 100%;
      border: 0;
      color: inherit;
      background: transparent;
      cursor: pointer;
      text-align: left;
    }
    .nav-parent {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 0 10px;
      border-radius: 7px;
      font-weight: 650;
    }
    .nav-parent:hover { background: rgba(255,255,255,.04); }
    .nav-parent .chevron { margin-left: auto; transition: transform .2s ease; }
    .nav-group.collapsed .chevron { transform: rotate(-90deg); }
    .nav-group.collapsed .nav-children { display: none; }
    .nav-children { padding: 3px 0 4px 36px; }
    .nav-item {
      min-height: 36px;
      padding: 0 12px;
      border-radius: 6px;
      color: #93A1B9;
      font-size: 13px;
      position: relative;
    }
    .nav-item:hover { color: white; }
    .nav-item.active { color: white; background: var(--brand); }
    .nav-item.active::before {
      content: "";
      position: absolute;
      left: -24px;
      top: 12px;
      width: 12px;
      height: 2px;
      background: #6FE1CC;
    }
    .ico { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .shell { margin-left: var(--sidebar); min-height: 100vh; }
    .topbar {
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex;
      align-items: center;
      padding: 0 28px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .crumb { color: var(--muted); font-size: 13px; }
    .crumb strong { color: var(--ink); }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .search-global {
      width: 238px;
      height: 38px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      color: var(--muted);
      background: #F7F8FB;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .search-global input { width: 100%; border: 0; outline: 0; color: var(--ink); background: transparent; }
    .icon-btn {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }
    .icon-btn:hover { border-color: #B7C4D8; background: #F8FAFD; }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; color: white; background: var(--ink); border-radius: 50%; font-size: 12px; font-weight: 700; }

    .content { padding: 28px; }
    .page-head { min-height: 38px; display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
    .page-desc { margin: 0; color: var(--muted); font-size: 13px; }
    .page-actions { margin-left: auto; display: flex; gap: 8px; }
    .btn {
      height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 15px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      cursor: pointer;
      font-weight: 650;
      font-size: 13px;
    }
    .btn:hover { border-color: #B8C3D4; background: #F8FAFD; }
    .btn.primary { color: white; background: var(--brand); border-color: var(--brand); }
    .btn.primary:hover { background: var(--brand-dark); }
    .btn.sm { height: 32px; padding: 0 11px; font-size: 12px; }

    .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .stat-card {
      min-height: 138px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent, var(--brand));
      border-radius: 3px 3px var(--radius) var(--radius);
      box-shadow: 0 5px 18px rgba(20,35,59,.035);
    }
    .stat-top { display: flex; align-items: center; color: var(--muted); }
    .stat-top .ico { margin-left: auto; color: var(--accent, var(--brand)); }
    .stat-value { margin-top: 14px; font-size: 28px; font-weight: 780; letter-spacing: -.04em; }
    .stat-foot { display: flex; align-items: center; gap: 7px; margin-top: 9px; font-size: 12px; color: var(--muted); }
    .delta { color: var(--success); font-weight: 700; }

    .lifecycle {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(7, minmax(0,1fr));
      background: var(--ink);
      color: white;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .life-step { min-height: 88px; padding: 17px 16px; border-right: 1px solid rgba(255,255,255,.1); position: relative; }
    .life-step:last-child { border-right: 0; }
    .life-label { color: #91A0B9; font-size: 11px; }
    .life-value { margin-top: 8px; font-size: 17px; font-weight: 740; }
    .life-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); position: absolute; right: 13px; top: 17px; box-shadow: 0 0 0 4px rgba(20,168,137,.15); }
    .life-step.warn .life-dot { background: var(--warning); box-shadow: 0 0 0 4px rgba(232,154,40,.16); }

    .dashboard-grid { margin-top: 14px; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(280px, .8fr); gap: 14px; }
    .panel { background: white; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 4px 16px rgba(20,35,59,.035); }
    .panel-head { min-height: 58px; display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .panel-title { font-size: 15px; font-weight: 730; }
    .panel-sub { margin-left: 10px; color: var(--muted); font-size: 12px; }
    .panel-more { margin-left: auto; color: var(--brand); font-size: 12px; font-weight: 650; cursor: pointer; border: 0; background: none; }
    .chart-wrap { height: 272px; padding: 20px 20px 10px; position: relative; }
    .chart-grid { position: absolute; inset: 28px 20px 38px; display: grid; grid-template-rows: repeat(4,1fr); }
    .chart-grid span { border-top: 1px dashed #E7EBF2; }
    .bars { height: 210px; position: relative; z-index: 1; display: flex; align-items: end; gap: 12px; padding: 0 14px; }
    .bar-pair { flex: 1; height: 100%; display: flex; align-items: end; justify-content: center; gap: 5px; position: relative; }
    .bar { width: 11px; height: var(--h); min-height: 4px; background: var(--brand); border-radius: 3px 3px 0 0; transition: filter .2s, transform .2s; }
    .bar.api { background: var(--success); opacity: .85; }
    .bar-pair:hover .bar { filter: brightness(.94); transform: translateY(-2px); }
    .bar-label { position: absolute; bottom: -25px; color: var(--muted); font-size: 10px; }
    .legend { display: flex; gap: 15px; margin-left: auto; color: var(--muted); font-size: 11px; }
    .legend span::before { content: ""; width: 8px; height: 8px; display: inline-block; margin-right: 5px; background: var(--brand); border-radius: 2px; }
    .legend span:last-child::before { background: var(--success); }
    .todo-list { padding: 7px 18px 12px; }
    .todo { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; min-height: 58px; border-bottom: 1px solid var(--line); }
    .todo:last-child { border: 0; }
    .todo-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--tone); background: color-mix(in srgb, var(--tone) 10%, white); }
    .todo-name { font-size: 13px; font-weight: 650; }
    .todo-desc { margin-top: 3px; color: var(--muted); font-size: 11px; }
    .todo-count { color: var(--tone); font-size: 18px; font-weight: 760; }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px; background: white; border: 1px solid var(--line); border-radius: var(--radius); }
    .field { height: 36px; min-width: 150px; padding: 0 11px; border: 1px solid var(--line); border-radius: 7px; color: var(--ink); background: white; outline: 0; }
    .field.search { width: 250px; }
    .query-actions { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
    .reconciliation-kpis {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .reconciliation-kpi {
      min-width: 0;
      min-height: 112px;
      padding: 14px 15px;
      background: white;
      border: 1px solid var(--line);
      border-top: 3px solid var(--kpi-tone, var(--brand));
      border-radius: 3px 3px var(--radius) var(--radius);
      box-shadow: 0 4px 16px rgba(20,35,59,.035);
    }
    .reconciliation-kpi.tone-brand { --kpi-tone: var(--brand); }
    .reconciliation-kpi.tone-success { --kpi-tone: var(--success); }
    .reconciliation-kpi.tone-warning { --kpi-tone: var(--warning); }
    .reconciliation-kpi.tone-danger { --kpi-tone: var(--danger); }
    .reconciliation-kpi > span { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .reconciliation-kpi > span::before { content: ""; width: 6px; height: 6px; flex: 0 0 auto; border-radius: 50%; background: var(--kpi-tone, var(--brand)); }
    .reconciliation-kpi strong { display: block; margin-top: 11px; color: var(--ink); font-size: clamp(17px, 1.35vw, 21px); font-weight: 780; font-variant-numeric: tabular-nums; letter-spacing: -.035em; overflow-wrap: anywhere; }
    .reconciliation-kpi small { display: block; margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .quick-tabs { display: flex; align-items: center; gap: 4px; margin-bottom: 14px; padding: 0 14px; overflow-x: auto; background: white; border: 1px solid var(--line); border-radius: var(--radius); }
    .quick-tab { min-height: 48px; display: inline-flex; align-items: center; gap: 7px; padding: 0 14px; color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
    .quick-tab.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 700; }
    .quick-tab-count { min-width: 20px; padding: 2px 6px; color: var(--muted); background: #F1F3F7; border-radius: 10px; font-size: 10px; text-align: center; }
    .quick-tab.active .quick-tab-count { color: var(--brand-dark); background: #EEF2FF; }
    .table-card { margin-top: 14px; overflow: hidden; background: white; border: 1px solid var(--line); border-radius: var(--radius); }
    .data-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    .data-table th { height: 44px; padding: 0 15px; color: #68758A; background: #F8FAFC; border-bottom: 1px solid var(--line); font-size: 11px; font-weight: 720; text-align: left; letter-spacing: .02em; }
    .data-table td { height: 58px; padding: 0 15px; border-bottom: 1px solid #EEF1F5; font-size: 12px; }
    .data-table tbody tr:hover { background: #FAFBFF; }
    [data-product-layout] .data-table th:last-child,
    [data-product-layout] .data-table td:last-child,
    [data-supplier-source-page] .data-table th:last-child,
    [data-supplier-source-page] .data-table td:last-child { position: sticky; right: 0; z-index: 1; min-width: 220px; background: white; border-left: 1px solid var(--line); }
    [data-product-layout] .data-table th:last-child,
    [data-supplier-source-page] .data-table th:last-child { z-index: 2; background: #F8FAFC; }
    [data-product-layout] .data-table tbody tr:hover td:last-child,
    [data-supplier-source-page] .data-table tbody tr:hover td:last-child { background: #FAFBFF; }
    .link { color: var(--brand); font-weight: 680; cursor: pointer; border: 0; background: none; padding: 0; }
    .link.danger-link { color: var(--danger); }
    .link:disabled { cursor: not-allowed; opacity: .48; }
    .order-table th:last-child,
    .order-table td:last-child { position: sticky; right: 0; z-index: 2; min-width: 190px; background: white; box-shadow: -8px 0 12px rgba(20,35,59,.025); }
    .order-table th:last-child { z-index: 3; background: #F8FAFC; }
    .order-table tbody tr:hover td:last-child { background: #FAFBFF; }
    .order-actions { display: flex; align-items: center; gap: 11px; white-space: nowrap; }
    .order-action-error { margin: -4px 20px 16px; padding: 9px 11px; color: #B72F40; background: #FFF1F3; border-left: 3px solid var(--danger); border-radius: 4px; font-size: 11px; }
    .order-action-error[hidden] { display: none; }
    .order-action-note { padding: 11px 12px; color: var(--ink-2); background: #F6F8FC; border: 1px solid var(--line); border-radius: 7px; font-size: 12px; line-height: 1.6; }
    .order-confirmation { min-height: 42px; display: flex; align-items: center; gap: 9px; padding: 0 11px; background: #FFF8EB; border: 1px solid #F3D9AB; border-radius: 7px; color: #80580D; font-size: 12px; }
    .order-confirmation input { accent-color: var(--danger); }
    .tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 5px; color: var(--muted); background: #F1F3F7; font-size: 11px; font-weight: 650; }
    .tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .tag.success { color: #0B856D; background: #E8F7F3; }
    .tag.warning { color: #A96708; background: #FFF4DF; }
    .tag.danger { color: #C63C4A; background: #FDECEE; }
    .tag.info { color: var(--brand-dark); background: #EEF2FF; }
    .muted { color: var(--muted); }
    .money { font-variant-numeric: tabular-nums; font-weight: 650; }
    .pagination { min-height: 62px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 0 16px; }
    .page-btn { min-width: 32px; height: 32px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: white; cursor: pointer; font-size: 12px; }
    .page-btn.active { color: white; background: var(--brand); border-color: var(--brand); }
    .tree-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; }
    .tree { min-height: 590px; padding: 14px; background: white; border: 1px solid var(--line); border-radius: var(--radius); }
    .tree-title { margin: 2px 2px 12px; font-size: 14px; font-weight: 730; }
    .tree-search { width: 100%; margin-bottom: 12px; }
    .tree-node { min-height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 9px; border-radius: 6px; cursor: pointer; }
    .tree-node:hover { background: #F6F8FC; }
    .tree-node.active { color: var(--brand-dark); background: #EEF2FF; font-weight: 700; }
    .tree-node.l2 { padding-left: 28px; }
    .tree-node.l3 { padding-left: 48px; }
    .tree-count { margin-left: auto; color: var(--muted); font-size: 10px; }
    .product-catalog-layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; align-items: start; }
    .product-category-tree { min-height: 590px; padding: 12px; background: white; border: 1px solid var(--line); border-radius: var(--radius); }
    .product-tree-list { display: grid; gap: 2px; }
    .product-tree-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: center; gap: 2px; }
    .product-tree-row.child { padding-left: 26px; }
    .product-tree-expander {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
    .product-tree-expander:hover { color: var(--brand); background: #F1F4FA; }
    .product-tree-expander.collapsed svg { transform: rotate(-90deg); }
    .product-tree-spacer { width: 24px; }
    .product-category-node {
      min-width: 0;
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
    }
    .product-category-node:hover { background: #F6F8FC; }
    .product-category-node.active { color: var(--brand-dark); background: #EEF2FF; font-weight: 700; }
    .product-category-node span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .product-category-node .tree-count { flex: 0 0 auto; }
    .product-list-panel { min-width: 0; }
    .product-current-category { display: inline-flex; align-items: center; min-height: 36px; padding: 0 11px; color: var(--muted); background: #F6F8FC; border-radius: 7px; white-space: nowrap; }
    .product-current-category strong { margin-left: 5px; color: var(--ink); }
    .category-tree-table { min-width: 1080px; }
    .category-tree-table .category-parent-row { background: #FBFCFF; }
    .category-tree-table .category-parent-row td { font-weight: 680; }
    .category-tree-table .category-child-row td { background: white; }
    .category-name-cell { min-width: 190px; display: flex; align-items: center; gap: 9px; }
    .category-name-cell.child { padding-left: 34px; }
    .category-expander {
      width: 24px;
      height: 24px;
      display: grid;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      color: var(--muted);
      background: white;
      border: 1px solid var(--line);
      border-radius: 5px;
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease;
    }
    .category-expander:hover { color: var(--brand); border-color: #B7C4D8; }
    .category-expander.collapsed svg { transform: rotate(-90deg); }
    .category-branch { width: 12px; height: 1px; flex: 0 0 auto; background: #C4CDDA; }
    .category-code { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .count-link { color: var(--brand-dark); font-weight: 740; }
    .row-actions { display: flex; align-items: center; gap: 12px; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(16,27,50,.45);
      backdrop-filter: blur(3px);
    }
    .modal-backdrop[hidden] { display: none !important; }
    .modal-card { width: min(560px, calc(100vw - 48px)); max-height: calc(100vh - 48px); overflow: auto; background: white; border-radius: 12px; box-shadow: 0 24px 70px rgba(20,35,59,.24); }
    .modal-card.wide { width: min(780px, calc(100vw - 48px)); }
    .modal-head { min-height: 64px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--line); }
    .modal-title { font-size: 16px; font-weight: 760; }
    .modal-close { margin-left: auto; width: 32px; height: 32px; border: 0; border-radius: 6px; color: var(--muted); background: #F4F6FA; cursor: pointer; }
    .modal-form { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; padding: 20px; }
    .modal-field { display: grid; gap: 7px; }
    .modal-field[hidden] { display: none !important; }
    .modal-field.full { grid-column: 1 / -1; }
    .modal-field label { color: var(--muted); font-size: 12px; }
    .modal-field .field { width: 100%; }
    .modal-actions { min-height: 64px; display: flex; align-items: center; justify-content: flex-end; gap: 9px; padding: 0 20px; background: #F8FAFC; border-top: 1px solid var(--line); }
    .modal-actions [hidden] { display: none !important; }
    .person-cell { display: flex; align-items: center; gap: 10px; }
    .person-mark { width: 30px; height: 30px; display: grid; flex: 0 0 auto; place-items: center; color: var(--brand-dark); background: #EEF2FF; border-radius: 8px; font-size: 11px; font-weight: 760; }
    .person-name { font-weight: 700; }
    .person-id { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .permission-tree { display: grid; gap: 10px; max-height: 350px; padding: 0 20px 20px; overflow: auto; }

    .mapping-product-count { color: var(--brand-dark); font-size: 11px; font-weight: 740; white-space: nowrap; }

    .mapping-relation-path { fill: none; stroke: var(--success); stroke-width: 2; opacity: .82; transition: opacity .18s, stroke-width .18s; }

      font-weight: 760;

    .switch-label { margin-left: 6px; color: var(--muted); font-size: 11px; }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }

    function reconciliationKpiBoard(kpis, ariaLabel, marker = '') {
      const cards = kpis.map(([label, value, note, tone]) => `<article class="reconciliation-kpi tone-${tone}" data-reconciliation-kpi><span>${label}</span><strong data-reconciliation-kpi-value>${value}</strong><small data-reconciliation-kpi-note>${note}</small></article>`).join('');

    const orderStatusOptions = [
      ['ALL','全部'],
      ['PENDING','待处理'],
      ['TO_SHIP','待发货'],
      ['SHIPPED','已发货'],
      ['COMPLETED','已完成'],
      ['AFTER_SALE_OR_EXCEPTION','售后/异常']

    const orderViewStates = {
      'mini-orders': { aggregateStatus: 'ALL', keyword: '' },
      'api-orders': { aggregateStatus: 'ALL', keyword: '' }

    const orderActionState = { view: '', orderId: '', action: '' };

    function findOrderRow(view, orderId) {
      return rows[view]?.find(row => row[0] === orderId);
    }

    function getOrderActionModel(row) {
      const detailAction = { action: 'detail', label: '查看详情' };
      const orderStatus = String(row[6]);
      const purchaseResult = String(row[7]);
      const combinedStatus = `${orderStatus} ${purchaseResult}`;
      if (['退款中','退款处理中','售后中'].some(keyword => combinedStatus.includes(keyword))) {
        return [detailAction, { action: 'refund', label: '退款处理中', disabled: true, danger: true }];
      }
      if (['已取消','已关闭'].some(keyword => combinedStatus.includes(keyword))) return [detailAction];
      if (['采购失败','待重试'].some(keyword => combinedStatus.includes(keyword))) {
        return [detailAction, { action: 'close', label: '关闭订单', danger: true }];
      }
      if (orderStatus.includes('待付款')) return [detailAction, { action: 'close', label: '关闭订单', danger: true }];
      if (orderStatus.includes('待发货')) {
        return [detailAction, { action: 'ship', label: '发货' }, { action: 'refund', label: '退款', danger: true }];
      }
      if (orderStatus.includes('已发货') || orderStatus.includes('已完成')) {
        return [detailAction, { action: 'refund', label: '退款', danger: true }];
      }
      return [detailAction];
    }

    function renderOrderActions(view, row) {
      const actions = getOrderActionModel(row).map(item => `<button class="link ${item.danger ? 'danger-link' : ''}" data-order-action="${item.action}" data-order-view="${view}" data-order-id="${row[0]}" ${item.disabled ? 'disabled' : ''}>${item.label}</button>`).join('');
      return `<div class="order-actions" data-order-actions>${actions}</div>`;
    }

    function renderOrderActionModal() {
      return `<div class="modal-backdrop" data-order-action-modal hidden><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="orderActionTitle"><div class="modal-head"><span class="modal-title" id="orderActionTitle" data-order-action-title>订单操作</span><button class="modal-close" data-order-action-close aria-label="关闭">×</button></div><div class="modal-form" data-order-action-body></div><div class="order-action-error" data-order-action-error hidden></div><div class="modal-actions"><button class="btn" data-order-action-close>取消</button><button class="btn primary" data-order-action-submit>确认</button></div></section></div>`;
    }

    function openOrderActionModal(action, view, orderId) {
      const row = findOrderRow(view, orderId);
      const modal = document.querySelector('[data-order-action-modal]');
      if (!row || !modal) return;
      Object.assign(orderActionState, { view, orderId, action });
      const channelLabel = view === 'mini-orders' ? '商城订单' : 'API 订单';
      const amountLabel = view === 'mini-orders' ? '消费积分 / 结算金额' : '结算金额';
      const amountValue = view === 'mini-orders' ? `${row[3]} / ${row[4]}` : row[3];
      const costValue = view === 'mini-orders' ? row[5] : row[4];
      const body = modal.querySelector('[data-order-action-body]');
      const title = modal.querySelector('[data-order-action-title]');
      const submit = modal.querySelector('[data-order-action-submit]');
      const footerClose = modal.querySelector('.modal-actions [data-order-action-close]');
      const error = modal.querySelector('[data-order-action-error]');
      error.hidden = true;
      error.textContent = '';
      submit.hidden = action === 'detail';
      footerClose.textContent = action === 'detail' ? '关闭' : '取消';
      if (action === 'detail') {
        title.textContent = '查看订单详情';
        body.innerHTML = `<div class="modal-field"><label>订单号</label><strong>${escapeHtml(row[0])}</strong></div><div class="modal-field"><label>渠道类型</label><strong>${channelLabel}</strong></div><div class="modal-field"><label>企业</label><strong>${escapeHtml(row[1])}</strong></div><div class="modal-field"><label>商品</label><strong>${escapeHtml(row[2])}</strong></div><div class="modal-field"><label>${amountLabel}</label><strong>${escapeHtml(amountValue)}</strong></div><div class="modal-field"><label>采购成本</label><strong>${escapeHtml(costValue)}</strong></div><div class="modal-field"><label>订单状态</label><strong>${escapeHtml(row[6])}</strong></div><div class="modal-field"><label>采购结果</label><strong>${escapeHtml(row[7])}</strong></div>`;
      } else if (action === 'ship') {
        title.textContent = '订单发货';
        submit.textContent = '确认发货';
        body.innerHTML = `<div class="modal-field full"><label>订单</label><strong>${escapeHtml(row[0])} · ${escapeHtml(row[2])}</strong></div><div class="modal-field"><label>物流公司</label><select class="field" data-order-logistics-company><option value="">请选择物流公司</option><option>顺丰速运</option><option>京东物流</option><option>中通快递</option></select></div><div class="modal-field"><label>物流单号</label><input class="field" data-order-tracking-number placeholder="请输入物流单号"></div><div class="modal-field full"><div class="order-action-note">确认后订单进入“已发货”，列表将立即更新发货状态和可执行操作。</div></div>`;
      } else if (action === 'refund') {
        const refundPath = view === 'mini-orders' ? '按原积分及支付路径退回' : '按原人民币结算路径退回';
        title.textContent = '发起订单退款';
        submit.textContent = '确认退款';
        body.innerHTML = `<div class="modal-field"><label>订单号</label><strong>${escapeHtml(row[0])}</strong></div><div class="modal-field"><label>退款范围</label><strong>${escapeHtml(amountValue)}</strong></div><div class="modal-field full"><div class="order-action-note"><strong>${refundPath}</strong><br>当前静态原型只演示操作反馈，不调用真实退款接口。</div></div><div class="modal-field full"><label>退款原因</label><textarea class="field" data-order-refund-reason style="height:82px;padding-top:9px;resize:vertical" placeholder="请填写退款原因"></textarea></div><div class="modal-field full"><label class="order-confirmation"><input type="checkbox" data-order-action-confirm>我已核对退款范围和原路退回影响</label></div>`;
      } else if (action === 'close') {
        title.textContent = '关闭订单';
        submit.textContent = '确认关闭';
        body.innerHTML = `<div class="modal-field full"><label>订单</label><strong>${escapeHtml(row[0])} · ${escapeHtml(row[2])}</strong></div><div class="modal-field full"><label>关闭原因</label><select class="field" data-order-close-reason><option value="">请选择关闭原因</option><option>采购失败不再重试</option><option>客户主动取消</option><option>超时未付款</option></select></div><div class="modal-field full"><label class="order-confirmation"><input type="checkbox" data-order-action-confirm>我确认关闭后订单不可继续发货</label></div>`;
      }
      modal.hidden = false;
    }

    function closeOrderActionModal() {
      const modal = document.querySelector('[data-order-action-modal]');
      if (modal) modal.hidden = true;
      Object.assign(orderActionState, { view: '', orderId: '', action: '' });
    }

    function submitOrderAction() {
      const { view, orderId, action } = orderActionState;
      const row = findOrderRow(view, orderId);
      const modal = document.querySelector('[data-order-action-modal]');
      if (!row || !modal || !action) return;
      const error = modal.querySelector('[data-order-action-error]');
      const showError = message => {
        error.textContent = message;
        error.hidden = false;
      };
      const availableAction = getOrderActionModel(row).find(item => item.action === action && !item.disabled);
      if (!availableAction) return showError('当前订单状态已变化，请刷新后重试');
      if (action === 'ship') {
        if (!modal.querySelector('[data-order-logistics-company]').value) return showError('请选择物流公司');
        if (!modal.querySelector('[data-order-tracking-number]').value.trim()) return showError('请输入物流单号');
        row[6] = '已发货';
        row[7] = '已受理';
      } else if (action === 'refund') {
        if (!modal.querySelector('[data-order-refund-reason]').value.trim()) return showError('请填写退款原因');
        if (!modal.querySelector('[data-order-action-confirm]').checked) return showError('请确认退款影响');
        row[6] = '退款中';
        row[7] = '退款处理中';
      } else if (action === 'close') {
        if (!modal.querySelector('[data-order-close-reason]').value) return showError('请选择关闭原因');
        if (!modal.querySelector('[data-order-action-confirm]').checked) return showError('请确认关闭订单');
        row[6] = '已取消';
        row[7] = '已关闭';
      }
      const actionLabel = action === 'ship' ? '发货' : action === 'refund' ? '退款' : '关闭订单';
      modal.hidden = true;
      Object.assign(orderActionState, { view: '', orderId: '', action: '' });
      render(view);
      toast(`${orderId} ${actionLabel}操作已更新`);
    }

    function getAggregateOrderStatus(row) {
      const orderStatus = String(row[6]);
      const purchaseResult = String(row[7]);
      const combinedStatus = `${orderStatus} ${purchaseResult}`;
      if (orderStatus.includes('已取消') || purchaseResult.includes('已关闭')) return 'CANCELLED';
      if (['售后','退款','采购失败','待重试','失败'].some(keyword => combinedStatus.includes(keyword))) return 'AFTER_SALE_OR_EXCEPTION';
      if (['处理中','结果未知','待确认'].some(keyword => combinedStatus.includes(keyword))) return 'PENDING';
      if (orderStatus.includes('待发货')) return 'TO_SHIP';
      if (orderStatus.includes('已发货')) return 'SHIPPED';
      if (orderStatus.includes('已完成')) return 'COMPLETED';
      return 'PENDING';
    }

      const [, desc, heads, action] = meta[view];
      const state = orderViewStates[view];
      const keyword = state.keyword.toLowerCase();
      const keywordRows = rows[view].filter(row => !keyword || row.join(' ').toLowerCase().includes(keyword));
      const counts = Object.fromEntries(orderStatusOptions.map(([status]) => [
        status,
        status === 'ALL' ? keywordRows.length : keywordRows.filter(row => getAggregateOrderStatus(row) === status).length
      ]));
      const filteredRows = state.aggregateStatus === 'ALL'
        ? keywordRows
        : keywordRows.filter(row => getAggregateOrderStatus(row) === state.aggregateStatus);
      const body = filteredRows.length
        ? filteredRows.map(row => `<tr data-order-row="${row[0]}">${row.map((cell,index) => {
            const value = index === 0
              ? `<button class="link" onclick="toast('已打开 ${cell} 详情')">${cell}</button>`

        : `<tr><td colspan="${heads.length + 1}" class="muted" style="height:96px;text-align:center">当前条件下暂无订单</td></tr>`;
      const tabs = orderStatusOptions.map(([status, label]) => `<button class="quick-tab ${state.aggregateStatus === status ? 'active' : ''}" data-order-status-tab="${status}">${label}<span class="quick-tab-count" data-order-count>${counts[status]}</span></button>`).join('');
      return `<div class="page-head"><p class="page-desc">${desc}</p><div class="page-actions"><button class="btn" onclick="toast('${action}已生成')">${icon('i-download')}${action}</button></div></div>

    function syncPermissionParent(moduleCode) {

      const children = [...modal.querySelectorAll(`[data-permission-child][data-permission-module="${moduleCode}"]`)];
      const parent = modal.querySelector(`[data-permission-parent="${moduleCode}"]`);
      if (!parent) return;
      const selectedCount = children.filter(child => child.checked).length;
      parent.checked = children.length > 0 && selectedCount === children.length;
      parent.indeterminate = selectedCount > 0 && selectedCount < children.length;
    }

      if (navigator.clipboard?.writeText) {
        try {
          await navigator.clipboard.writeText(url);
          copied = true;
        } catch (error) {
          copied = false;
        }
      }
      if (!copied) {
        const textarea = document.createElement('textarea');
        textarea.value = url;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        copied = document.execCommand('copy');
        textarea.remove();
      }
      toast(copied ? '公开链接已复制' : '复制失败，请手工复制公开地址');
    }

    function findCategory(categoryId) {
      for (const parent of categoryData) {
        if (parent.id === categoryId) return { category: parent, parent: null };
        const child = parent.children.find(item => item.id === categoryId);
        if (child) return { category: child, parent };

      return { category: null, parent: null };

    function syncCategoryLevelFields() {
      const modal = document.querySelector('[data-category-modal]');

      const levelSelect = modal.querySelector('[name="categoryLevel"]');
      const parentField = modal.querySelector('[data-category-parent-field]');

      if (level === 1) parentSelect.value = '';
      modal.dataset.categoryLevel = String(level);
      if (!modal.dataset.categoryId) {

      const modal = document.querySelector('[data-category-modal]');

      const { category, parent } = findCategory(categoryId);
      const level = category?.level || 1;
      modal.dataset.categoryId = categoryId;
      modal.dataset.categoryLevel = String(level);
      modal.querySelector('[data-category-modal-title]').textContent = category ? `编辑${level === 1 ? '一级' : '二级'}分类` : `新增${level === 1 ? '一级' : '二级'}分类`;

    function saveCategoryEditor() {
      const modal = document.querySelector('[data-category-modal]');
      if (!modal) return;
      const name = modal.querySelector('[name="categoryName"]').value.trim();
      const code = modal.querySelector('[name="categoryCode"]').value.trim();
      if (!name || !code) { toast('请完整填写分类名称和编码'); return; }
      const level = Number(modal.querySelector('[name="categoryLevel"]').value);
      const parentId = modal.querySelector('[name="categoryParent"]').value;
      if (level === 2 && !parentId) { toast('请选择所属一级分类'); return; }
      const values = { name, code, sort: Number(modal.querySelector('[name="categorySort"]').value || 0), status: modal.querySelector('[name="categoryStatus"]').value, updatedAt: '08-14 15:10' };
      const result = findCategory(modal.dataset.categoryId);
      if (result.category) {
        Object.assign(result.category, values);
      } else if (level === 1) {
        categoryData.push({ id: `category-${Date.now()}`, level: 1, expanded: false, children: [], ...values });
      } else {
        const parent = categoryData.find(category => category.id === parentId);
        if (!parent) { toast('请选择所属一级分类'); return; }
        parent.children.push({ id: `category-${Date.now()}`, level: 2, sourcingCount: 0, selfOperatedCount: 0, ...values });
        parent.expanded = true;
      }
      closeCategoryEditor();
      render('category');
      toast('分类配置已保存');
    }

      const result = findCategory(categoryId);
      if (!result.category) return;
      if (result.category.level === 1 && result.category.children.length) {
        toast(`存在 ${result.category.children.length} 个二级分类，不能删除`);

    function renderMappingPlatformTree(records) {
      const mappedTargets = new Set(records.filter(row => row.platformCategoryId).map(row => row.platformCategoryId));
      const targetRelationCounts = records.reduce((counts, row) => {
        if (row.platformCategoryId) counts[row.platformCategoryId] = (counts[row.platformCategoryId] || 0) + 1;
        return counts;
      }, {});
      const nodes = categoryData.map(parent => {
        const collapsed = mappingViewState.collapsedPlatformIds.has(parent.id);
        const expander = parent.children.length
          ? `<button class="product-tree-expander ${collapsed ? 'collapsed' : ''}" data-mapping-platform-toggle="${parent.id}" aria-label="${collapsed ? '展开' : '收起'}${parent.name}" aria-expanded="${!collapsed}">${icon('i-chevron')}</button>`
          : '<span class="product-tree-spacer"></span>';
        const parentNode = `<div class="product-tree-row">${expander}<div class="product-category-node"><span>${parent.name}</span><span class="tree-count">${parent.children.length}</span></div></div>`;
        const children = parent.children.map(child => {
          const relationCount = targetRelationCounts[child.id] || 0;
          return `<div class="product-tree-row child"><span class="product-tree-spacer"></span><div class="product-category-node level-two ${mappedTargets.has(child.id) ? 'mapped-target' : ''}" data-mapping-platform-node="${child.id}" title="${parent.name} / ${child.name}"><span>${child.name}</span><span class="tree-count">${relationCount ? `${relationCount} 条关系` : '—'}</span></div></div>`;
        }).join('');
        return `${parentNode}<div data-mapping-platform-children="${parent.id}" ${collapsed ? 'hidden' : ''}>${children}</div>`;
      }).join('');
      return `<section class="mapping-tree-panel mapping-platform-tree" data-mapping-platform-tree><div class="mapping-tree-head"><strong>平台商品分类</strong><span>平台统一两级分类</span></div><div class="mapping-tree-body"><div class="product-tree-list">${nodes}</div></div></section>`;
    }

    function renderMappingSourceTree(records) {
      const groups = new Map();
      records.forEach(row => {
        const [parentName = '未分组'] = row.sourcePath.split(' / ');
        if (!groups.has(parentName)) groups.set(parentName, []);
        groups.get(parentName).push(row);
      });
      const groupNodes = [...groups.entries()].map(([parentName, rows]) => {
        const groupKey = `${mappingViewState.supplierId}:${parentName}`;
        const collapsed = mappingViewState.collapsedSourceGroupKeys.has(groupKey);
        const children = rows.map(row => {
          const isMapped = Boolean(row.platformCategoryId);
          const sourceStatusText = row.sourceStatus === 'ACTIVE' ? '有效' : '已失效';
          const operation = row.sourceStatus === 'ACTIVE'
            ? `<button class="link" data-mapping-edit="${row.sourceCategoryId}">${isMapped ? '修改映射' : '设置映射'}</button>`
            : '';
          return `<article class="mapping-source-node ${isMapped ? 'mapped' : 'unmapped'} ${row.sourceStatus === 'INVALID' ? 'invalid' : ''}" data-mapping-row="${row.sourceCategoryId}" data-mapping-source-node="${row.sourceCategoryId}" tabindex="0" title="${escapeHtml(row.sourcePath)}"><div class="mapping-source-main"><div><div class="mapping-source-path">${escapeHtml(row.sourceName)}</div><div class="mapping-source-code">${escapeHtml(row.sourceCode)}</div></div><div class="mapping-source-meta">${tag(isMapped ? '已映射' : '未映射', isMapped ? 'success' : 'warning')}${tag(sourceStatusText,row.sourceStatus === 'ACTIVE' ? 'success' : 'danger')}</div></div><div class="mapping-source-foot"><button class="link mapping-product-count" data-mapping-product-link="${row.sourceCategoryId}">${row.productCount} 个产品</button><div class="mapping-source-actions">${operation}${isMapped ? `<button class="link" data-mapping-history="${row.sourceCategoryId}">查看历史</button>` : ''}</div></div></article>`;
        }).join('');
        return `<section class="mapping-source-group"><div class="mapping-source-parent"><button class="product-tree-expander ${collapsed ? 'collapsed' : ''}" data-mapping-source-toggle="${escapeHtml(groupKey)}" aria-label="${collapsed ? '展开' : '收起'}${escapeHtml(parentName)}" aria-expanded="${!collapsed}">${icon('i-chevron')}</button><span>${escapeHtml(parentName)}</span><span class="tree-count">${rows.length}</span></div><div class="mapping-source-children" data-mapping-source-children="${escapeHtml(groupKey)}" ${collapsed ? 'hidden' : ''}>${children}</div></section>`;
      }).join('');
      const body = groupNodes || '<div class="mapping-empty">当前查询条件下暂无来源分类</div>';
      return `<section class="mapping-tree-panel mapping-source-tree" data-mapping-source-tree><div class="mapping-tree-head"><strong>${mappingSupplier().name}来源分类</strong><span>仅二级分类参与映射</span></div><div class="mapping-tree-body"><div class="mapping-source-groups">${body}</div></div></section>`;
    }

    function drawMappingRelations() {
      const workspace = document.querySelector('[data-mapping-compare]');
      const layer = workspace?.querySelector('[data-mapping-relations]');
      if (!workspace || !layer) return;
      const workspaceRect = workspace.getBoundingClientRect();
      const relations = filteredMappingRows().filter(row => row.platformCategoryId).map(row => {
        const sourceNode = workspace.querySelector(`[data-mapping-source-node="${row.sourceCategoryId}"]`);
        const targetNode = workspace.querySelector(`[data-mapping-platform-node="${row.platformCategoryId}"]`);
        if (!sourceNode || !targetNode || sourceNode.offsetParent === null || targetNode.offsetParent === null) return null;
        const sourceRect = sourceNode.getBoundingClientRect();
        const targetRect = targetNode.getBoundingClientRect();
        const startX = sourceRect.left - workspaceRect.left;
        const startY = sourceRect.top - workspaceRect.top + sourceRect.height / 2;
        const endX = targetRect.right - workspaceRect.left;
        const endY = targetRect.top - workspaceRect.top + targetRect.height / 2;
        const controlOffset = Math.max(54, (startX - endX) * .34);
        return {
          row,
          path: `M ${startX} ${startY} C ${startX - controlOffset} ${startY}, ${endX + controlOffset} ${endY}, ${endX} ${endY}`,
          labelX: (startX + endX) / 2,
          labelY: (startY + endY) / 2
        };
      }).filter(Boolean);
      const paths = relations.map(({ row, path }) => `<path class="mapping-relation-path ${row.sourceStatus === 'INVALID' ? 'invalid' : ''}" data-mapping-relation="${row.sourceCategoryId}" data-relation-source="${row.sourceCategoryId}" d="${path}" marker-end="url(#${row.sourceStatus === 'INVALID' ? 'mapping-arrow-invalid' : 'mapping-arrow'})"></path>`).join('');
      const labels = relations.map(({ row, labelX, labelY }) => `<span class="mapping-relation-label ${row.sourceStatus === 'INVALID' ? 'invalid' : ''}" data-mapping-product-count data-relation-source="${row.sourceCategoryId}" style="left:${labelX}px;top:${labelY}px">${row.productCount} 个产品</span>`).join('');
      layer.innerHTML = `<svg aria-hidden="true" viewBox="0 0 ${workspaceRect.width} ${workspaceRect.height}" preserveAspectRatio="none"><defs><marker id="mapping-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#14A889"></path></marker><marker id="mapping-arrow-invalid" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#E24D5C"></path></marker></defs>${paths}</svg>${labels}`;
    }

    function setMappingRelationHighlight(sourceCategoryId = '') {
      const workspace = document.querySelector('[data-mapping-compare]');
      if (!workspace) return;
      workspace.classList.toggle('relation-highlighting', Boolean(sourceCategoryId));
      workspace.querySelectorAll('.relation-active').forEach(element => element.classList.remove('relation-active'));
      if (!sourceCategoryId) return;
      const row = findMappingRow(sourceCategoryId);
      workspace.querySelector(`[data-mapping-source-node="${sourceCategoryId}"]`)?.classList.add('relation-active');
      if (row?.platformCategoryId) workspace.querySelector(`[data-mapping-platform-node="${row.platformCategoryId}"]`)?.classList.add('relation-active');
      workspace.querySelectorAll(`[data-relation-source="${sourceCategoryId}"]`).forEach(element => element.classList.add('relation-active'));
    }

    function syncMappingPlatformChild(selectedChildId = '') {
      const modal = document.querySelector('[data-mapping-modal]');
      if (!modal) return;
      const parentId = modal.querySelector('[data-mapping-platform-parent]').value;
      const childSelect = modal.querySelector('[data-mapping-platform-child]');
      const parent = categoryData.find(item => item.id === parentId);
      const options = (parent?.children || []).filter(child => child.status === '启用').map(child => `<option value="${child.id}">${child.name}</option>`).join('');
      childSelect.innerHTML = `<option value="">请选择二级分类</option>${options}`;
      childSelect.disabled = !parentId;
      if (selectedChildId && childSelect.querySelector(`option[value="${selectedChildId}"]`)) childSelect.value = selectedChildId;

      const row = findMappingRow(sourceCategoryId);
      const modal = document.querySelector('[data-mapping-modal]');
      if (!row || !modal) return;
      modal.dataset.sourceCategoryId = sourceCategoryId;
      modal.dataset.rowVersion = String(row.rowVersion);
      modal.querySelector('[data-mapping-modal-title]').textContent = row.platformCategoryId ? '修改分类映射' : '设置分类映射';
      modal.querySelector('[data-mapping-editor-body]').hidden = false;
      modal.querySelector('[data-mapping-history-body]').hidden = true;
      modal.querySelector('[data-mapping-unbind-confirmation]').hidden = true;
      modal.querySelector('[data-mapping-source-name]').textContent = row.sourceName;
      modal.querySelector('[data-mapping-source-code]').textContent = row.sourceCode;
      modal.querySelector('[data-mapping-source-path]').textContent = row.sourcePath;
      modal.querySelector('[data-mapping-product-count]').textContent = `${row.productCount} 个`;

    function saveMappingEditor() {
      const modal = document.querySelector('[data-mapping-modal]');
      const row = findMappingRow(modal?.dataset.sourceCategoryId);
      if (!modal || !row) return;
      if (Number(modal.dataset.rowVersion) !== row.rowVersion) return toast('映射已被更新，请刷新后重试');
      const targetId = modal.querySelector('[data-mapping-platform-child]').value;
      const target = findCategory(targetId).category;
      if (!targetId || !target || target.level !== 2 || target.status !== '启用') return toast('请选择启用中的平台二级分类');
      const before = platformCategoryPath(row.platformCategoryId);
      row.platformCategoryId = targetId;
      row.rowVersion += 1;
      row.updatedAt = '08-14 15:46';
      row.history.unshift({ action: before === '—' ? '新增映射' : '修改映射', before, after: platformCategoryPath(targetId), source: '手工操作', operator: '平台运营员', time: row.updatedAt, productCount: row.productCount });
      render('category-mapping');
      toast('分类映射已生效');
    }

      modal.querySelector('[data-mapping-editor-body]').hidden = true;
      modal.querySelector('[data-mapping-unbind-confirmation]').hidden = false;

    const supplierSourceViewState = { supplierId: 'JX', platformName: '京选集采', sourceCategoryId: '', sourceCategoryPath: '', aggregationStatus: 'ALL', returnView: 'suppliers' };
    const supplierSourceProducts = [
      { supplierId: 'JX', sourceCategoryId: 'JX-PAPER', code: 'JX-882601', name: 'A4 复印纸 70g 5包装', sourcePath: '办公用品 / 办公纸品', sku: 'JX-SKU-601', cost: '¥ 80.00', stock: '568', aggregation: '已归集', syncedAt: '10 分钟前', syncResult: '同步成功' },
      { supplierId: 'JX', sourceCategoryId: 'JX-KEYBOARD', code: 'JX-882586', name: '无线蓝牙键盘 K3', sourcePath: '数码设备 / 键盘', sku: 'JX-SKU-586', cost: '¥ 176.00', stock: '83', aggregation: '已归集', syncedAt: '10 分钟前', syncResult: '同步成功' },
      { supplierId: 'JX', sourceCategoryId: 'JX-POWER', code: 'JX-882572', name: '便携充电宝 10000mAh', sourcePath: '数码设备 / 电源', sku: 'JX-SKU-572', cost: '¥ 96.00', stock: '0', aggregation: '待归集', syncedAt: '10 分钟前', syncResult: '库存不足' },
      { supplierId: 'JX', sourceCategoryId: 'JX-MEETING', code: 'JX-882548', name: '会议平板 65 英寸', sourcePath: '数码设备 / 会议平板', sku: 'JX-SKU-548', cost: '¥ 4,680.00', stock: '12', aggregation: '待映射', syncedAt: '10 分钟前', syncResult: '等待分类映射' },
      { supplierId: 'QCY', sourceCategoryId: 'QCY-CUP', code: 'QCY-11628', name: '商务保温杯 480ml', sourcePath: '员工福利 / 水杯', sku: 'QCY-SKU-628', cost: '¥ 58.00', stock: '226', aggregation: '已归集', syncedAt: '18 分钟前', syncResult: '同步成功' },
      { supplierId: 'QCY', sourceCategoryId: 'QCY-BACKPACK', code: 'QCY-11482', name: '轻量商务双肩包', sourcePath: '箱包服饰 / 商务双肩包', sku: 'QCY-SKU-482', cost: '¥ 112.00', stock: '64', aggregation: '待映射', syncedAt: '18 分钟前', syncResult: '等待分类映射' },
      { supplierId: 'HC', sourceCategoryId: 'HC-OFFICE', code: 'HC-30216', name: '办公耗材组合装', sourcePath: '办公集采 / 通用耗材', sku: 'HC-SKU-216', cost: '¥ 138.00', stock: '102', aggregation: '已归集', syncedAt: '2 小时前', syncResult: '同步成功' }
    ];

    function supplierSourceProductsPage() {
      const { supplierId, platformName, sourceCategoryId, sourceCategoryPath, aggregationStatus } = supplierSourceViewState;
      const currentRows = supplierSourceProducts.filter(item => item.supplierId === supplierId)
        .filter(item => !sourceCategoryId || item.sourceCategoryId === sourceCategoryId)
        .filter(item => aggregationStatus === 'ALL' || item.aggregation === aggregationStatus);
      const body = currentRows.length ? currentRows.map(item => {
        const mappingRow = findMappingRow(item.sourceCategoryId);
        const mappingText = mappingRow?.platformCategoryId ? platformCategoryPath(mappingRow.platformCategoryId) : '未映射';
        return `<tr><td><button class="link" onclick="toast('已打开来源商品 ${item.code}')">${item.code}</button></td><td>${item.name}</td><td>${item.sourcePath}</td><td>${item.sku}</td><td class="money">${item.cost}</td><td>${item.stock}</td><td>${mappingText}</td><td>${tag(item.aggregation,item.aggregation === '已归集' ? 'success' : item.aggregation === '待映射' ? 'danger' : 'warning')}</td><td>${item.syncedAt}</td><td>${tag(item.syncResult,toneFor(item.syncResult))}</td><td><div class="row-actions"><button class="link" onclick="toast('已打开 ${item.code} 来源详情')">查看详情</button><button class="link" onclick="toast('已重新同步 ${item.code}')">重新同步</button><button class="link" onclick="toast('已打开 ${item.code} 分类映射')">查看映射</button></div></td></tr>`;
      }).join('') : `<tr><td colspan="11" class="muted" style="height:96px;text-align:center">当前条件下暂无来源商品</td></tr>`;
      const sourcePathText = sourceCategoryPath || '全部来源分类';
      const aggregationOptions = [['ALL','全部归集状态'],['已归集','已归集'],['待归集','待归集'],['待映射','待映射']].map(([value,label]) => `<option value="${value}" ${aggregationStatus === value ? 'selected' : ''}>${label}</option>`).join('');
      return `<div data-supplier-source-page><div class="page-head"><p class="page-desc">${platformName} · 当前来源分类：${sourcePathText} · ${aggregationStatus === 'ALL' ? '全部归集状态' : aggregationStatus}</p><div class="page-actions"><button class="btn" data-supplier-source-back>返回${supplierSourceViewState.returnView === 'category-mapping' ? '分类映射' : '供货平台'}</button><button class="btn primary" onclick="toast('已发起 ${platformName} 商品同步')">${icon('i-sync')}同步来源商品</button></div></div>
        <div class="tree-layout"><aside class="tree"><div class="tree-title">来源两级分类 · ${platformName}</div><input class="field tree-search" placeholder="搜索来源分类"><div class="tree-node ${sourceCategoryId ? '' : 'active'}">全部来源商品 <span class="tree-count">${supplierSourceProducts.filter(item => item.supplierId === supplierId).length}</span></div><div class="tree-node">⌄ 办公用品</div><div class="tree-node l2">办公纸品</div><div class="tree-node">⌄ 数码设备</div><div class="tree-node l2 ${sourceCategoryId === 'JX-MEETING' ? 'active' : ''}">会议平板</div></aside>
        <section class="detail-panel">${queryToolbar(`<span class="product-current-category">来源分类：<strong>${sourcePathText}</strong></span><input class="field search" placeholder="搜索商品名称或来源编码"><select class="field" data-source-aggregation-filter>${aggregationOptions}</select><select class="field"><option>全部同步结果</option><option>同步成功</option><option>库存不足</option><option>等待分类映射</option></select>`)}<div class="table-card"><div style="overflow:auto"><table class="data-table"><thead><tr><th>来源商品编码</th><th>商品名称</th><th>来源分类</th><th>来源SKU</th><th>最新采购价</th><th>库存</th><th>分类映射</th><th>平台商品归集状态</th><th>最近同步</th><th>同步结果</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div>${pagination(String(currentRows.length))}</div></section></div></div>`;
    }

    const pageRenderers = {
      dashboard,
      'channel-analysis': channelAnalysisPage,
      'mini-orders': () => orderListPage('mini-orders'),
      'api-orders': () => orderListPage('api-orders'),
      category: categoryPage,
      products: productPage,
      suppliers: suppliersPage,
      'category-mapping': categoryMappingPage,
      'supplier-source-products': supplierSourceProductsPage,
      'system-users': systemUsersPage,
      'system-roles': systemRolesPage,
      'system-api-docs': systemApiDocsPage
    };
    const render = view => {
      if (view === 'sourcing-products') {
        productViewState.source = '集采';
        render('products');
        toast('原集采商品入口已合并至商品管理');
        return;
      }
      if (view === 'channel-analysis' && currentView !== 'channel-analysis') analysisViewState.channel = 'mini';
      const content = document.getElementById('content');
      content.innerHTML = pageRenderers[view] ? pageRenderers[view]() : listPage(view);
      const navigationView = view === 'supplier-source-products' ? supplierSourceViewState.returnView : view;
      const current = document.querySelector(`.nav-item[data-view="${navigationView}"]`);
      document.querySelectorAll('.nav-item').forEach(element => element.classList.remove('active'));
      current?.classList.add('active');
      document.getElementById('crumbCurrent').textContent = view === 'supplier-source-products' ? `${navigationView === 'category-mapping' ? '分类映射' : '供货平台'} / 来源商品` : current?.textContent || '经营总览';
      content.querySelectorAll('[data-analysis-tab]').forEach(element => element.addEventListener('click', () => {
        if (analysisViewState.channel === element.dataset.analysisTab) return;
        analysisViewState.channel = element.dataset.analysisTab;
        render('channel-analysis');
      }));
      content.querySelector('[data-analysis-period]')?.addEventListener('change', event => {
        analysisViewState.period = event.target.value;
        toast(`已切换为${analysisViewState.period}数据`);
      });
      content.querySelector('[data-analysis-export]')?.addEventListener('click', () => {
        toast(`已导出${analysisData[analysisViewState.channel].tabLabel}${analysisViewState.period}报表`);
      });
      content.querySelectorAll('[data-goto]').forEach(element => element.addEventListener('click', () => render(element.dataset.goto)));
      content.querySelectorAll('[data-order-status-tab]').forEach(element => element.addEventListener('click', () => {
        orderViewStates[view].aggregateStatus = element.dataset.orderStatusTab;
        render(view);
        toast(`已切换到${element.textContent.replace(/\d+/g, '').trim()}订单`);
      }));
      content.querySelectorAll('[data-order-action]:not(:disabled)').forEach(element => element.addEventListener('click', () => {
        openOrderActionModal(element.dataset.orderAction, element.dataset.orderView, element.dataset.orderId);
      }));
      content.querySelectorAll('[data-order-action-close]').forEach(element => element.addEventListener('click', closeOrderActionModal));
      content.querySelector('[data-order-action-submit]')?.addEventListener('click', submitOrderAction);
      content.querySelector('[data-query-submit]')?.addEventListener('click', () => {
        if (view === 'products') {
          productViewState.keyword = content.querySelector('[data-product-keyword]').value.trim();
          productViewState.source = content.querySelector('[data-product-source]').value;
          productViewState.status = content.querySelector('[data-product-status]').value;
          render(view);
        } else if (orderViewStates[view]) {
          orderViewStates[view].keyword = content.querySelector('[data-order-keyword]').value.trim();
          render(view);
        } else if (view === 'system-users') {
          userViewState.keyword = content.querySelector('[data-user-keyword]').value.trim();
          userViewState.roleId = content.querySelector('[data-user-role-filter]').value;
          userViewState.status = content.querySelector('[data-user-status-filter]').value;
          render(view);
        } else if (view === 'system-roles') {
          roleViewState.keyword = content.querySelector('[data-role-keyword]').value.trim();
          roleViewState.status = content.querySelector('[data-role-status-filter]').value;
          render(view);
        } else if (view === 'category-mapping') {
          mappingViewState.keyword = content.querySelector('[data-mapping-keyword]').value.trim();
          mappingViewState.mappingStatus = content.querySelector('[data-mapping-status-filter]').value;
          mappingViewState.sourceStatus = content.querySelector('[data-mapping-source-status-filter]').value;
          render(view);
        } else if (view === 'supplier-source-products') {
          supplierSourceViewState.aggregationStatus = content.querySelector('[data-source-aggregation-filter]').value;
          render(view);
        }
        toast('已按当前条件查询');
      });
      content.querySelector('[data-query-reset]')?.addEventListener('click', () => {
        if (view === 'products') {
          productViewState.keyword = '';
          productViewState.source = 'all';
          productViewState.status = 'all';
        } else if (orderViewStates[view]) {
          orderViewStates[view].keyword = '';
        } else if (view === 'system-users') {
          Object.assign(userViewState, { keyword: '', roleId: 'ALL', status: 'ALL' });
        } else if (view === 'system-roles') {
          Object.assign(roleViewState, { keyword: '', status: 'ALL' });
        } else if (view === 'category-mapping') {
          Object.assign(mappingViewState, { keyword: '', mappingStatus: 'ALL', sourceStatus: 'ALL' });
        } else if (view === 'supplier-source-products') {
          supplierSourceViewState.aggregationStatus = 'ALL';
        }
        render(view);
        toast('查询条件已重置，列表已刷新');
      });
      content.querySelectorAll('.page-btn[data-page]').forEach(element => element.addEventListener('click', () => {
        content.querySelectorAll('.page-btn[data-page]').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        toast(`已切换到第 ${element.dataset.page} 页`);
      }));
      content.querySelectorAll('[data-switch]').forEach(element => element.addEventListener('click', () => {
        element.classList.toggle('on');
        const label = element.nextElementSibling;
        if (label) label.textContent = element.classList.contains('on') ? '已开启' : '已关闭';
        toast('渠道展示开关已更新');
      }));
      content.querySelectorAll('[data-supplier-sources]').forEach(element => element.addEventListener('click', () => {
        const supplier = mappingSuppliers.find(item => item.name === element.dataset.supplierSources) || mappingSuppliers[0];
        Object.assign(supplierSourceViewState, { supplierId: supplier.id, platformName: supplier.name, sourceCategoryId: '', sourceCategoryPath: '', aggregationStatus: 'ALL', returnView: 'suppliers' });
        render('supplier-source-products');
      }));
      content.querySelector('[data-supplier-source-back]')?.addEventListener('click', () => render(supplierSourceViewState.returnView));
      content.querySelectorAll('[data-mapping-supplier-tab]').forEach(element => element.addEventListener('click', () => {
        Object.assign(mappingViewState, { supplierId: element.dataset.mappingSupplierTab, keyword: '', mappingStatus: 'ALL', sourceStatus: 'ALL' });
        render('category-mapping');
        toast(`已切换至${mappingSupplier().name}`);
      }));
      content.querySelectorAll('[data-mapping-platform-toggle]').forEach(element => element.addEventListener('click', () => {
        const categoryId = element.dataset.mappingPlatformToggle;
        if (mappingViewState.collapsedPlatformIds.has(categoryId)) mappingViewState.collapsedPlatformIds.delete(categoryId);
        else mappingViewState.collapsedPlatformIds.add(categoryId);
        render('category-mapping');
      }));
      content.querySelectorAll('[data-mapping-source-toggle]').forEach(element => element.addEventListener('click', () => {
        const groupKey = element.dataset.mappingSourceToggle;
        if (mappingViewState.collapsedSourceGroupKeys.has(groupKey)) mappingViewState.collapsedSourceGroupKeys.delete(groupKey);
        else mappingViewState.collapsedSourceGroupKeys.add(groupKey);
        render('category-mapping');
      }));
      content.querySelectorAll('[data-mapping-source-node]').forEach(element => {
        const sourceCategoryId = element.dataset.mappingSourceNode;
        element.addEventListener('mouseenter', () => setMappingRelationHighlight(sourceCategoryId));
        element.addEventListener('mouseleave', () => setMappingRelationHighlight());
        element.addEventListener('focusin', () => setMappingRelationHighlight(sourceCategoryId));
        element.addEventListener('focusout', () => setMappingRelationHighlight());
      });
      content.querySelector('[data-api-doc-preview]')?.addEventListener('click', () => window.open(publicApiDocUrl(), '_blank', 'noopener'));
      content.querySelector('[data-api-doc-copy]')?.addEventListener('click', copyPublicApiDocUrl);
      content.querySelectorAll('[data-mapping-edit]').forEach(element => element.addEventListener('click', () => openMappingEditor(element.dataset.mappingEdit)));
      content.querySelectorAll('[data-mapping-history]').forEach(element => element.addEventListener('click', () => openMappingHistory(element.dataset.mappingHistory)));
      content.querySelectorAll('[data-mapping-modal-close]').forEach(element => element.addEventListener('click', closeMappingModal));
      content.querySelector('[data-mapping-platform-parent]')?.addEventListener('change', () => syncMappingPlatformChild());
      content.querySelector('[data-mapping-save]')?.addEventListener('click', saveMappingEditor);
      content.querySelector('[data-mapping-unbind]')?.addEventListener('click', requestUnbindMapping);
      content.querySelector('[data-mapping-unbind-cancel]')?.addEventListener('click', () => {
        content.querySelector('[data-mapping-unbind-confirmation]').hidden = true;
        content.querySelector('[data-mapping-editor-body]').hidden = false;
      });
      content.querySelector('[data-mapping-unbind-confirm]')?.addEventListener('click', confirmUnbindMapping);
      content.querySelectorAll('[data-mapping-product-link]').forEach(element => element.addEventListener('click', () => {
        const row = findMappingRow(element.dataset.mappingProductLink);
        if (!row) return;
        const supplier = mappingSupplier(row.supplierId);
        Object.assign(supplierSourceViewState, { supplierId: supplier.id, platformName: supplier.name, sourceCategoryId: row.sourceCategoryId, sourceCategoryPath: row.sourcePath, aggregationStatus: row.platformCategoryId ? 'ALL' : '待映射', returnView: 'category-mapping' });
        render('supplier-source-products');
      }));
      content.querySelector('[data-mapping-import]')?.addEventListener('click', () => resetMappingImportModal('upload'));
      content.querySelector('[data-mapping-import-history]')?.addEventListener('click', () => resetMappingImportModal('history'));
      content.querySelector('[data-mapping-import-close]')?.addEventListener('click', () => {
        content.querySelector('[data-mapping-import-modal]').hidden = true;
      });
      content.querySelector('[data-mapping-import-preview]')?.addEventListener('click', () => {
        content.querySelector('[data-mapping-import-upload]').hidden = true;
        content.querySelector('[data-mapping-import-preview-body]').hidden = false;
      });
      content.querySelector('[data-mapping-import-back]')?.addEventListener('click', () => {
        content.querySelector('[data-mapping-import-preview-body]').hidden = true;
        content.querySelector('[data-mapping-import-upload]').hidden = false;
      });
      content.querySelector('[data-mapping-import-execute]')?.addEventListener('click', () => {
        content.querySelector('[data-mapping-import-preview-body]').hidden = true;
        content.querySelector('[data-mapping-import-result]').hidden = false;
      });
      content.querySelectorAll('[data-product-category]').forEach(element => element.addEventListener('click', () => {
        productViewState.selectedCategoryId = element.dataset.productCategory;
        render('products');
        toast(`已查询${getSelectedProductCategory().name}分类商品`);
      }));
      content.querySelectorAll('[data-product-tree-toggle]').forEach(element => element.addEventListener('click', () => {
        const categoryId = element.dataset.productTreeToggle;
        const children = content.querySelector(`[data-product-tree-children="${categoryId}"]`);
        const willExpand = children.hidden;
        children.hidden = !willExpand;
        element.classList.toggle('collapsed', !willExpand);
        element.setAttribute('aria-expanded', String(willExpand));
        if (willExpand) productViewState.expandedCategoryIds.add(categoryId);
        else productViewState.expandedCategoryIds.delete(categoryId);
      }));
      content.querySelectorAll('[data-category-toggle]').forEach(element => element.addEventListener('click', () => toggleCategory(element.dataset.categoryToggle)));
      content.querySelectorAll('[data-category-edit]').forEach(element => element.addEventListener('click', () => openCategoryEditor(element.dataset.categoryEdit)));
      content.querySelector('[data-category-add]')?.addEventListener('click', () => openCategoryEditor());
      content.querySelector('[data-category-modal] [name="categoryLevel"]')?.addEventListener('change', syncCategoryLevelFields);
      content.querySelectorAll('[data-category-modal-close]').forEach(element => element.addEventListener('click', closeCategoryEditor));
      content.querySelector('[data-category-save]')?.addEventListener('click', saveCategoryEditor);
      content.querySelectorAll('[data-category-status]').forEach(element => element.addEventListener('click', () => toggleCategoryStatus(element.dataset.categoryStatus)));
      content.querySelectorAll('[data-category-delete]').forEach(element => element.addEventListener('click', () => deleteCategory(element.dataset.categoryDelete)));
      content.querySelector('[data-user-add]')?.addEventListener('click', () => openUserEditor());
      content.querySelectorAll('[data-user-edit]').forEach(element => element.addEventListener('click', () => openUserEditor(element.dataset.userEdit)));
      content.querySelectorAll('[data-user-modal-close]').forEach(element => element.addEventListener('click', closeUserEditor));
      content.querySelector('[data-user-save]')?.addEventListener('click', saveUserEditor);
      content.querySelectorAll('[data-user-status]').forEach(element => element.addEventListener('click', () => toggleSystemUser(element.dataset.userStatus)));
      content.querySelectorAll('[data-user-reset-password]').forEach(element => element.addEventListener('click', () => toast('密码已重置，首次登录需修改')));
      content.querySelector('[data-role-add]')?.addEventListener('click', () => openRoleEditor());
      content.querySelectorAll('[data-role-edit]').forEach(element => element.addEventListener('click', () => openRoleEditor(element.dataset.roleEdit)));
      content.querySelectorAll('[data-role-modal-close]').forEach(element => element.addEventListener('click', closeRoleEditor));
      content.querySelector('[data-role-save]')?.addEventListener('click', saveRoleEditor);
      content.querySelectorAll('[data-role-status]').forEach(element => element.addEventListener('click', () => toggleSystemRole(element.dataset.roleStatus)));
      content.querySelectorAll('[data-permission-parent]').forEach(element => element.addEventListener('change', () => {
        content.querySelectorAll(`[data-permission-child][data-permission-module="${element.dataset.permissionParent}"]`).forEach(child => child.checked = element.checked);
        element.indeterminate = false;
      }));
      content.querySelectorAll('[data-permission-child]').forEach(element => element.addEventListener('change', () => syncPermissionParent(element.dataset.permissionModule)));
      currentView = view;
      if (view === 'category-mapping') drawMappingRelations();
    };
    window.addEventListener('resize', () => {
      if (currentView === 'category-mapping') requestAnimationFrame(drawMappingRelations);
    });
    document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', () => render(item.dataset.view)));
    document.querySelectorAll('.nav-parent').forEach(parent => parent.addEventListener('click', () => parent.closest('.nav-group').classList.toggle('collapsed')));
    render('dashboard');
  </script>
</body>
</html>
